name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v1.0.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write   # create the GitHub Release and upload assets
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0   # build number = commit count

      - name: Check the tag matches VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match VERSION ${version}"
            exit 1
          fi

      - name: Test
        run: swift test

      - name: Build universal app and archives
        run: make release

      - name: Release notes from CHANGELOG
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo 'curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash'
            echo '```'
            echo
            echo 'Or with Homebrew:'
            echo
            echo '```bash'
            echo 'brew tap ericrisco/memslop https://github.com/${{ github.repository }}'
            echo 'brew install --cask memslop'
            echo '```'
            echo
            echo 'Already installed? MemSlop updates itself within a day.'
          } >> notes.md
          cat notes.md

      - name: Publish
        run: |
          version="${TAG#v}"
          assets=(dist/MemSlop.zip dist/MemSlop.zip.sha256 "dist/MemSlop-${version}.zip" dist/checksums.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "${assets[@]}" --title "MemSlop ${version}" --notes-file notes.md --verify-tag
          fi

      - name: Update the Homebrew cask on main
        run: |
          version="${TAG#v}"
          sha="$(shasum -a 256 "dist/MemSlop-${version}.zip" | awk '{print $1}')"
          git fetch --quiet origin main
          git checkout --quiet -B cask-update origin/main
          current="$(sed -n 's/^  version "\(.*\)"/\1/p' Casks/memslop.rb)"
          # Rebuilding an older tag must not move the cask backwards.
          newest="$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -1)"
          if [ "$newest" != "$version" ]; then
            echo "Cask is at ${current}; not downgrading to ${version}."
            exit 0
          fi
          sed -i '' -e "s/^  version \".*\"/  version \"${version}\"/" -e "s/^  sha256 \".*\"/  sha256 \"${sha}\"/" Casks/memslop.rb
          if git diff --quiet; then
            echo "Cask already at ${version}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -am "chore(cask): memslop ${version}"
          git push --quiet origin HEAD:main
